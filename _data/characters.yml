# 每個角色一段。id 用英文，貼文裡的 character: 要對得上。
# avatar：放在 assets/avatars/ 的圖檔名；沒有圖就會顯示 glyph 那個字。
mo:
  name: 模
  handle: mo.unbacked
  novel: yu
  avatar: mo.svg
  glyph: 模
  color: "#b9653f"
  bio: 大里長大，花蓮念書，回台中工作。小時候怕球，但喜歡踢。
taro:
  name: 芋
  handle: taro.morning
  novel: market
  avatar: taro.svg
  glyph: 芋
  color: "#7a6a9e"
  bio: 三十一歲，在台中的老市場賣菜。四點半起床，番茄放最旁邊。
yang:
  name: 陽
  handle: yang.coffee
  novel: market
  glyph: "365"
  color: "#d98a2b"
  bio: 台北來的，在台中市場口開咖啡廳。番茄硬的切片，軟的煮醬。
lin:
  name: 林
  handle: LIN.YA
  novel: feichang
  glyph: 林
  color: "#4f6d7a"
  bio: 頭髮一直都是短的。彰化念藝術系，現在在台中。
wu:
  name: 吳
  handle: WWW.U
  novel: feichang
  avatar: wu.svg
  glyph: 吳
  color: "#c27c8e"
  bio: 做狗狗娃娃。不太出門，除了拍照。
