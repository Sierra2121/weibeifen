# 每個角色一段。id 用英文，貼文裡的 character: 要對得上。
# avatar：放在 assets/avatars/ 的圖檔名；沒有圖就會顯示 glyph 那個字。
mo:
  name: 模
  handle: mo.unbacked
  novel: yu
  avatar: mo.svg
  glyph: 模
  color: "#b9653f"
  bio: 大里長大，花蓮念書，回台中工作。小時候怕球，但喜歡踢。
taro:
  name: 芋
  handle: taro.morning
  novel: market
  avatar: taro.svg
  glyph: 芋
  color: "#7a6a9e"
  bio: 三十一歲，在台中的老市場賣菜。四點半起床，番茄放最旁邊。
yang:
  name: 陽
  handle: yang.coffee
  novel: market
  glyph: "365"
  color: "#d98a2b"
  bio: 台北來的，在台中市場口開咖啡廳。番茄硬的切片，軟的煮醬。
lin:
  name: 林
  handle: LIN.YA
  avatar: lin.svg
  novel: feichang
  glyph: 林
  color: "#4f6d7a"
  bio: 頭髮一直都是短的。彰化念藝術系，現在在台中。
wu:
  name: 吳
  handle: WWW.U
  novel: feichang
  avatar: wu.svg
  glyph: 吳
  color: "#c27c8e"
  bio: 做狗狗娃娃。不太出門，除了拍照。
chuan:
  name: 川
  handle: chuan.5000m
  novel: gongdi
  avatar: chuan.svg
  glyph: 川
  color: "#3f6b8a"
  bio: 興大附農機電科。155 公分，長頭髮，每天跑五公里。量東西要量十次。
qin:
  name: 秦
  handle: qin.and.xu
  novel: hongdian
  avatar: qin.svg
  glyph: 秦
  color: "#c8423a"
  bio: 情侶帳號「秦與栩，收音中」。拍她，也拍她看她的樣子。
cheng:
  name: 澄
  handle: cheng.tenseconds
  novel: hue
  glyph: 澄
  color: "#5c7a78"
  bio: 二十五歲，在城西境的禮儀社工作。看得到別人身上的顏色，看不到自己的。
lan:
  name: 嵐
  handle: lan.1955
  novel: houshan
  avatar: lan.svg
  glyph: 嵐
  color: "#6b7f8e"
  bio: 彰化人，1980 年自己申請調到台東教國小。報紙每一版都讀。
he:
  name: 禾
  handle: samingad
  novel: houshan
  avatar: he.svg
  glyph: 禾
  color: "#a8873a"
  bio: 卑南族，南王部落。家裡開雜貨店，有一小片釋迦園。會開車，會修東西。
