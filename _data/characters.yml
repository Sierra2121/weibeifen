# 每個角色一段。id 用英文，貼文裡的 character: 要對得上。
# avatar：放在 assets/avatars/ 的圖檔名；沒有圖就會顯示 glyph 那個字。
# 以下都可以不填，不填就不顯示：
#   pin：置頂一句話；pin_ch：那句話在第幾章
#   eras：跟著年份變的簡介，每筆 year + bio（章節頁會顯示「那一年的她」）
#   items：她的東西，每筆 name + note，ch 填第一次出現的章節（同一本小說的章節編號）
#   skip：自動點名時要跳過的詞（例如「秀禾」裡的「禾」不算點名）
mo:
  name: 模
  handle: mo.unbacked
  novel: yu
  avatar: mo.svg
  glyph: 模
  color: "#b9653f"
  bio: 大里長大，花蓮念書，回台中工作。小時候怕球，但喜歡踢。
taro:
  name: 芋
  handle: taro.morning
  novel: market
  avatar: taro.svg
  glyph: 芋
  color: "#7a6a9e"
  bio: 三十一歲，在台中的老市場賣菜。四點半起床，番茄放最旁邊。
yang:
  name: 陽
  handle: yang.coffee
  novel: market
  glyph: "365"
  color: "#d98a2b"
  bio: 台北來的，在台中市場口開咖啡廳。番茄硬的切片，軟的煮醬。
lin:
  name: 林
  handle: LIN.YA
  avatar: lin.svg
  novel: feichang
  glyph: 林
  color: "#4f6d7a"
  bio: 頭髮一直都是短的。彰化念藝術系，現在在台中。
wu:
  name: 吳
  handle: WWW.U
  novel: feichang
  avatar: wu.svg
  glyph: 吳
  color: "#c27c8e"
  bio: 做狗狗娃娃。不太出門，除了拍照。
chuan:
  name: 川
  handle: chuan.5000m
  novel: gongdi
  avatar: chuan.svg
  glyph: 川
  color: "#3f6b8a"
  bio: 興大附農機電科。155 公分，長頭髮，每天跑五公里。量東西要量十次。
qin:
  name: 秦
  handle: qin.and.xu
  novel: hongdian
  avatar: qin.svg
  glyph: 秦
  color: "#c8423a"
  bio: 情侶帳號「秦與栩，收音中」。拍她，也拍她看她的樣子。
cheng:
  name: 澄
  handle: cheng.tenseconds
  novel: hue
  glyph: 澄
  color: "#5c7a78"
  bio: 二十五歲，在城西境的禮儀社工作。看得到別人身上的顏色，看不到自己的。
lan:
  name: 嵐
  handle: lan.1955
  novel: houshan
  avatar: lan.svg
  glyph: 嵐
  color: "#6b7f8e"
  bio: 彰化人，1980 年自己申請調到台東教國小。報紙每一版都讀。
  pin: 拆不走才好。
  pin_ch: 44
  eras:
    - year: 1980
      bio: 二十五歲，從彰化逃到台東教國小，住進雜貨店樓上。報紙每一版都讀。
    - year: 1985
      bio: 戶籍遷到南王，關係欄寫「寄居」。頭髮讓禾在院子裡剪，剪到耳下。
    - year: 1989
      bio: 第一次在辦公室說出心裡的話。寫信告訴媽媽，桌子是誰做的。
    - year: 1993
      bio: 三十八歲。住進有一整面大窗的房子，窗戶是她出的錢。戶籍，還是寄居。
  items:
    - name: 剪報簿
      note: 封面寫「國語日報 作文範例」。在工寮的土裡埋了十一年，現在放在書架第二層。
      ch: 7
    - name: 有白線的石頭
      note: 都蘭海邊撿的，中間一圈白線沒有斷。只找到一顆，每天放在胸前口袋。
      ch: 35
    - name: 爸爸的十二個字
      note: 「嵐 台東很熱 多喝水 十年了 父」。左手寫的，跟她的九個字並排放在抽屜。
      ch: 43
    - name: 鋼筆
      note: 爸爸送的，從彰化帶來。周主任的退休申請書，是用這支寫的。
      ch: 48
    - name: 寫著「張」的收據
      note: 北邊那一整面窗戶的錢。跟石頭放在同一個口袋。
      ch: 51
he:
  name: 禾
  handle: samingad
  novel: houshan
  avatar: he.svg
  glyph: 禾
  color: "#a8873a"
  bio: 卑南族，南王部落。家裡開雜貨店，有一小片釋迦園。會開車，會修東西。
  pin: 窗戶是你的。
  pin_ch: 44
  skip: [秀禾]
  eras:
    - year: 1980
      bio: 二十七歲，卑南族，南王部落。顧雜貨店，有一小片釋迦園。會開車，會修東西，嘴巴硬。
    - year: 1985
      bio: 領光存款買了一塊平地，只能登記一個名字。用芒果木做了一張桌子。
    - year: 1988
      bio: 第一次去台北，喊還我土地。回來寫了遺囑，封口蓋三個印章。
    - year: 1993
      bio: 四十歲。房子蓋好了，起造人只寫得下陳秀禾。門口鋪滿都蘭的石頭。
  items:
    - name: 鐵盒
      note: 埋在釋迦園的工寮，膠帶繞四圈。蓋子上的花已經看不出顏色。
      ch: 7
    - name: 芒果木桌子
      note: 給嵐三十歲的生日。桌腳是她爸爸留在工寮後面的舊木頭。
      ch: 22
    - name: 身分證後面的紙條
      note: 嵐用注音拼的 Samingad。身分證上沒有這個名字。
      ch: 29
    - name: 白襯衫
      note: 只有一件。第一屆畢業典禮穿過，去彰化見嵐的爸爸也穿這件。
      ch: 30
    - name: 牛皮紙信封
      note: 遺囑。封口蓋三個木頭印章，裡面寫什麼，還沒有人看過。
      ch: 36
    - name: 紅包上的「陳」
      note: 嵐的爸爸用左手寫的。筆畫很多，他寫了很久。
      ch: 53
