# 每部小說一段。era＝時代・地點，tag＝題材（會顯示在選單書名下面）。id 用英文，貼文裡的 novel: 要對得上。icon 是側邊選單上的小圖示，可以放一個表情符號。
yu:
  title: 上釉
  era: 2002–・台中
  tag: 成長
  icon: 🏺
  blurb: 從沒有手機的童年，到智慧型手機，到 AI。一個二十四歲的人，還在找方向。
market:
  title: 看天
  era: 2025–・台中
  tag: 市場
  icon: 🍅
  blurb: 台中的老市場。賣菜的芋，和每天來挑番茄的咖啡廳老闆。
feichang:
  title: 蘿蔔
  era: 2018–2024・彰化台中
  tag: 藝術系
  icon: 🐕
  blurb: 彰化的藝術系，到台中。兩個人，一隻撿來的狗，七年。
gongdi:
  title: 共地
  era: 2023–・台中
  tag: 機電科
  icon: 🔌
  blurb: 2023 年，興大附農機電科。一個要量十次才甘願的女生，遇到一個不用練就拿第一的女生。
hongdian:
  title: 紅點
  era: 2026
  tag: 網紅
  icon: 🔴
  blurb: 錄影中的那顆紅點。看得見的是被拍的，看不見的才是真的。
hue:
  title: 忌色
  era: 2025–・台南府城
  tag: ABO・禮儀師
  icon: 🏮
  blurb: 台南府城。一個禮儀師看得到別人身上的顏色，一個八家將領隊看不到自己的。
houshan:
  title: 後山
  era: 1980–2010・台東
  tag: 年代・原住民
  icon: ⛰️
  blurb: 1980 年，台東。一個逃家來教書的老師，住進卑南族女人家雜貨店的樓上。三十年。
