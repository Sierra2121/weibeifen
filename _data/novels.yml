# 每部小說一段。tags＝介紹頁的標籤，intro＝介紹頁的簡介。era＝時代・地點，tag＝題材（會顯示在選單書名下面）。id 用英文，貼文裡的 novel: 要對得上。icon 是側邊選單上的小圖示，可以放一個表情符號。
yu:
  title: 上釉
  era: 2002–・台中
  tag: 成長
  icon: 🏺
  blurb: 竹子做的球門、第一支手機、一張找不到的照片。
  tags: [成長, 非線性]
  intro: 在大里三合院長大的模，小時候沒有手機，現在每天跟 AI 說話。二十四歲，還是會怕，但還在找。
market:
  split: true  # 兩個角色各自編章號
  title: 看天
  era: 2025–・台中
  tag: 市場
  icon: 🍅
  blurb: 凌晨四點半的菜攤，和早上九點才開門的咖啡廳。
  tags: [日常, 市場, 療癒]
  intro: 「她的番茄，我挑了一年。」市場裡賣菜的芋，市場口開咖啡廳的陽。看天吃飯的人，慢慢學會看另一個人。
feichang:
  split: true  # 兩個角色各自編章號
  title: 蘿蔔
  era: 2018–2024・彰化台中
  tag: 藝術系
  icon: 🐕
  blurb: 彰化的藝術系，到台中。兩個人，一隻撿來的狗，七年。
  tags: [校園, 藝術系, 七年]
  intro: 吳和林大一就在一起了。後來多了一隻從米腸山撿回來的狗，少了一頭長髮，吵了很多次架。從十八歲到二十四歲，從彰化到台中。
gongdi:
  title: 共地
  era: 2023–・台中
  tag: 機電科
  icon: 🔌
  blurb: 一個超慢、一個超快，兩個機電科女生在機器人比賽場邊撞在一起。
  tags: [校園, 機電科, 甜]
  intro: 「我量了十次，她看一眼就裝好了。」2023 年，興大附農的川在機器人比賽遇到台中高工的萌。從那天起，川的紀錄裡多了一個人。
hongdian:
  title: 紅點
  era: 2026
  tag: 網紅
  icon: 🔴
  blurb: 錄影中的那顆紅點。看得見的是被拍的，看不見的才是真的。
  tags: [網紅, 情侶帳號, 曖昧]
  intro: 秦經營情侶帳號「秦與栩，收音中」，靠拍她和女友栩的日常累積追蹤。紅點亮著的時候，她們是大家想看的樣子。紅點關掉之後呢？
hue:
  title: 忌色
  era: 2025–・台南府城
  tag: ABO・禮儀師
  icon: 🏮
  blurb: 台南府城。一個禮儀師看得到別人身上的顏色，一個八家將領隊看不到自己的。
  tags: [ABO, 末日, 禮儀師]
  intro: 病毒讓 Alpha 失去嗅覺，人和人之間變得難看。台南府城的禮儀師澄看得見別人身上的顏色，卻從沒告訴過誰。直到一場八家將老師傅的喪禮，她遇見了領陣的溫硯。
houshan:
  title: 後山
  era: 1980–2010・台東
  tag: 年代・原住民
  icon: ⛰️
  blurb: 1980 年，台東。一個逃家來教書的老師，住進卑南族女人家雜貨店的樓上。三十年。
  tags: [年代, 原住民, 三十年]
  intro: 每一年都有嵐和禾的幾個故事，跟著那一天台灣發生的事。戶籍欄寫著「寄居」，她們把日子過成了家。
exam:
  title: 比例原則
  era: 2025–2026・台北
  tag: 國考
  icon: 🖍️
  blurb: 同一本行政法，畫了兩種顏色的重點。
  tags: [國考, 補習班, 甜]
  intro: 兩個重考生，一張自習室的桌子，一年的倒數。行政法說，手段要合乎比例。可是喜歡一個人，要怎麼剛剛好？
yincang:
  title: 隱藏
  era: 2005–2008・雲嘉
  tag: 年代・迴避型
  icon: 💬
  blurb: MSN 顯示為離線。兩個人都在線，都設成隱藏。
  tags: [年代, 虐, 迴避型]
  intro: 2005 年，嘉義的網聚。很會熱場的設計師霜，遇到一個跟她一樣會熱場、也一樣會說謊的健身教練堤。說好就這樣，說好不過夜、不問家裡、不要喜歡上。她們都很會藏，直到藏不住。
shiyi:
  title: 拾遺
  era: 2019–2022・南投
  tag: 高中・歷史
  icon: 📜
  blurb: 黑板最左邊那條線，一整個學期都不會擦掉。
  tags: [校園, 歷史, 成長]
  intro: 2019 年，中興新村。108 課綱第一屆的拾，在第一堂歷史課看見簡老師盤起長髮、畫下一條時間軸。從那天起，她把每一堂課都記下來，從台灣、東亞到世界，一直記到她自己也開始寫歷史。
