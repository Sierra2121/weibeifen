# 每部小說一段。tags＝介紹頁的標籤，intro＝介紹頁的簡介。era＝時代・地點，tag＝題材（會顯示在選單書名下面）。id 用英文，貼文裡的 novel: 要對得上。icon 是側邊選單上的小圖示，可以放一個表情符號。
yu:
  title: 上釉
  era: 2002–・台中
  tag: 成長
  icon: 🏺
  blurb: 從沒有手機的童年，到智慧型手機，到 AI。一個二十四歲的人，還在找方向。
  tags: [成長, 非線性, 台中]
  intro: 在大里三合院長大的女生，從沒有手機的童年，走到智慧型手機，再走到每天跟 AI 說話的現在。每一章是一樣東西：竹子做的球門、第一支手機、一張找不到的照片。二十四歲，還是會怕，但還在找。
market:
  title: 看天
  era: 2025–・台中
  tag: 市場
  icon: 🍅
  blurb: 台中的老市場。賣菜的芋，和每天來挑番茄的咖啡廳老闆。
  tags: [日常, 市場, 療癒, 台中]
  intro: 台中一座老市場，凌晨四點半開攤的芋，和市場口那間咖啡廳的老闆陽。從三月到隔年三月，看天吃飯的人，慢慢學會看另一個人。後面有陽自己寫的番外。
feichang:
  title: 蘿蔔
  era: 2018–2024・彰化台中
  tag: 藝術系
  icon: 🐕
  blurb: 彰化的藝術系，到台中。兩個人，一隻撿來的狗，七年。
  tags: [校園, 藝術系, 七年, 彰化・台中]
  intro: 2018 年，彰化的藝術系，吳和林在大一上就在一起了。一隻在米腸山撿到的狗、一頭剪掉的長髮、很多次吵架。畢業後搬到台中，從十八歲到二十四歲。
gongdi:
  title: 共地
  era: 2023–・台中
  tag: 機電科
  icon: 🔌
  blurb: 一個超慢、一個超快，兩個機電科女生在機器人比賽場邊撞在一起。
  tags: [校園, 機電科, 甜, 台中]
  intro: 「我量了十次，她看一眼就裝好了。」2023 年，興大附農的川在機器人比賽遇到台中高工的萌。從那天起，川的紀錄裡多了一個人。
hongdian:
  title: 紅點
  era: 2026
  tag: 網紅
  icon: 🔴
  blurb: 錄影中的那顆紅點。看得見的是被拍的，看不見的才是真的。
  tags: [網紅, 情侶帳號, 曖昧]
  intro: 秦經營情侶帳號「秦與栩，收音中」，靠拍她跟女友栩的影片累積追蹤。錄影的紅點亮著的時候是一種樣子，關掉之後，是另一種。
hue:
  title: 忌色
  era: 2025–・台南府城
  tag: ABO・禮儀師
  icon: 🏮
  blurb: 台南府城。一個禮儀師看得到別人身上的顏色，一個八家將領隊看不到自己的。
  tags: [ABO, 末日, 禮儀師, 台南]
  intro: 一場病毒讓 Alpha 失去嗅覺，社會照常運轉，人和人之間卻變得難看。台南府城的禮儀師澄，看得見別人身上的顏色，從來沒告訴過誰。一場八家將老師傅的喪禮上，澄遇見了領陣的溫硯。
houshan:
  title: 後山
  era: 1980–2010・台東
  tag: 年代・原住民
  icon: ⛰️
  blurb: 1980 年，台東。一個逃家來教書的老師，住進卑南族女人家雜貨店的樓上。三十年。
  tags: [年代, 原住民, 台東, 三十年]
  intro: 1980 年，從彰化逃到台東教書的嵐，住進卑南族女人禾家雜貨店的樓上。三十年，每一年幾個故事，每個故事都跟著那一天台灣發生的事。戶籍欄寫著「寄居」，她們把日子過成了家。
