# 每部小說一段。id 用英文，貼文裡的 novel: 要對得上。icon 是側邊選單上的小圖示，可以放一個表情符號。
yu:
  title: 上釉
  icon: 🏺
  blurb: 從沒有手機的童年，到智慧型手機，到 AI。一個二十四歲的人，還在找方向。
market:
  title: 看天
  icon: 🍅
  blurb: 台中的老市場。賣菜的芋，和每天來挑番茄的咖啡廳老闆。
feichang:
  title: 肥腸
  icon: 🐕
  blurb: 彰化的藝術系，到台中。兩個人，一隻撿來的狗，七年。
gongdi:
  title: 共地
  icon: 🔌
  blurb: 2023 年，興大附農機電科。一個要量十次才甘願的女生，遇到一個不用練就拿第一的女生。
hongdian:
  title: 紅點
  icon: 🔴
  blurb: 錄影中的那顆紅點。看得見的是被拍的，看不見的才是真的。
hue:
  title: 忌色
  icon: 🎭
  blurb: 台南府城。一個禮儀師看得到別人身上的顏色，一個八家將領隊看不到自己的。
