<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}｜{% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand-name">{{ site.title }}</span>
    <span class="brand-sub">畝 的故事，由角色自己發文</span>
  </a>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="foot">© 畝 · 所有故事皆為虛構，若有雷同，可能是記憶出了錯。</footer>
<script id="chars" type="application/json">{{ site.data.characters | jsonify }}</script>
<script id="novels" type="application/json">{{ site.data.novels | jsonify }}</script>
<script>window.BASE = "{{ site.baseurl }}";</script>
<script src="{{ '/assets/app.js' | relative_url }}"></script>
</body>
</html>
