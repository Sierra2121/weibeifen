---
layout: default
---
<a class="back" href="{{ '/' | relative_url }}?c={{ page.character }}">← 回到{{ site.data.characters[page.character].name }}的頁面</a>
<section class="chapter">
  <h2>{{ page.title }}</h2>
  <div class="ch-text">{{ content }}</div>
  {% capture u %}{{ page.url | relative_url }}{% endcapture %}{% include actions.html key=page.slug url=u %}
</section>
