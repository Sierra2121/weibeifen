---
layout: default
---
<section id="novel" class="novel" hidden></section>
<section id="profile" class="profile" hidden></section>
<div class="feed">
{%- for post in site.posts -%}
  {% include teaser.html post=post %}
{%- endfor -%}
</div>
<button type="button" class="more-btn" hidden>載入更多</button>
<div class="chapters" hidden>
{%- assign ordered = site.posts | reverse -%}
{%- for post in ordered -%}
  {% include chapter.html post=post no=forloop.index %}
{%- endfor -%}
</div>
<p class="empty" hidden>這裡還沒有貼文。</p>
