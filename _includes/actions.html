<div class="actions" data-key="{{ include.key }}" data-url="{{ include.url }}">
  <button type="button" class="act like" aria-label="喜歡"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.6 8.4 3.4 5 6.8 5c2 0 3.4 1.1 5.2 3 1.8-1.9 3.2-3 5.2-3 3.4 0 5.2 3.4 4.1 6.3-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span class="n"></span></button>
  <button type="button" class="act talk" aria-label="留言"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20l1.2-4.1A8.5 8.5 0 1 1 20.5 11.5z"/></svg><span class="n"></span></button>
  <button type="button" class="act repost" aria-label="轉發"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5V8a3 3 0 0 1 3-3h12m-3-3 3 3-3 3M20 14.5V16a3 3 0 0 1-3 3H5m3 3-3-3 3-3"/></svg></button>
  <button type="button" class="act share" aria-label="分享"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg></button>
  <span class="toast" hidden>已複製連結</span>
  <div class="comments" hidden>
    <ul class="clist"></ul>
    <form class="cform"><input type="text" maxlength="200" placeholder="留言…（目前只有你自己看得到）"><button type="submit">送出</button></form>
  </div>
</div>
