  <!-- 骰子 -->
  <rect x="45" y="52" width="8" height="8" rx="1.5" fill="#fafafa" stroke="#c9c9c9" stroke-width="0.6"/>
  <circle cx="47.5" cy="54.5" r="0.8" fill="#d9413a"/>
  <circle cx="50.5" cy="57.5" r="0.8" fill="#d9413a"/>
