<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#e3e9ee"/>
  <!-- 後髮（耳下齊短髮） -->
  <path d="M14 34 C12 17 22 9 32 9 C42 9 52 17 50 34 L50 44 C46 46 18 46 14 44 Z" fill="#2a2420"/>
  <!-- 脖子與衣服 -->
  <rect x="27" y="45" width="10" height="9" fill="#f3d6c0"/>
  <path d="M10 64 C12 54 20 51 32 51 C44 51 52 54 54 64 Z" fill="#6b7f8e"/>
  <!-- 白襯衫領子 -->
  <path d="M25 51 L32 58 L39 51 L41 55 L32 62 L23 55 Z" fill="#f7f5ef"/>
  <path d="M32 58 L32 64" stroke="#d8d4ca" stroke-width="0.8"/>
  <circle cx="32" cy="60.5" r="0.7" fill="#d8d4ca"/>
  <!-- 口袋的鋼筆 -->
  <rect x="42" y="55" width="1.6" height="6" rx="0.6" fill="#1f2a36"/>
  <rect x="42" y="55" width="1.6" height="1.4" fill="#c9a54a"/>
  <!-- 臉 -->
  <ellipse cx="32" cy="33" rx="15" ry="16" fill="#f6dcc8"/>
  <!-- 瀏海（整齊、旁分） -->
  <path d="M17 31 C16 18 24 13 32 13 C41 13 49 19 48 31 C46 25 43 21 38 19 C34 22 27 24 21 25 C19 27 18 29 17 31 Z" fill="#2a2420"/>
  <!-- 黑色小髮夾 -->
  <rect x="40" y="20" width="6" height="1.6" rx="0.8" fill="#4a5866" transform="rotate(30 43 21)"/>
  <!-- 眉毛（細、規矩） -->
  <path d="M22 29.5 Q25.5 28.3 29 29.3" stroke="#2a2420" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M35 29.3 Q38.5 28.3 42 29.5" stroke="#2a2420" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- 眼睛 -->
  <ellipse cx="25.5" cy="34" rx="3" ry="3.9" fill="#2a2430"/>
  <ellipse cx="38.5" cy="34" rx="3" ry="3.9" fill="#2a2430"/>
  <ellipse cx="25.5" cy="35" rx="2" ry="2.5" fill="#4f6577"/>
  <ellipse cx="38.5" cy="35" rx="2" ry="2.5" fill="#4f6577"/>
  <circle cx="24.4" cy="32.6" r="1" fill="#fff"/>
  <circle cx="37.4" cy="32.6" r="1" fill="#fff"/>
  <!-- 腮紅 -->
  <ellipse cx="21" cy="40" rx="2.6" ry="1.4" fill="#e8a39a" opacity="0.5"/>
  <ellipse cx="43" cy="40" rx="2.6" ry="1.4" fill="#e8a39a" opacity="0.5"/>
  <!-- 嘴（抿著的小笑） -->
  <path d="M29.5 43 Q32 44.2 34.5 43" stroke="#a5574a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
