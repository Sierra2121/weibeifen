<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif">
<rect width="640" height="330" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">PLC 階梯圖：自保電路</text>
<line x1="50" y1="50" x2="50" y2="220" stroke="#333" stroke-width="4"/><line x1="590" y1="50" x2="590" y2="220" stroke="#333" stroke-width="4"/>
<text x="50" y="244" font-size="11" text-anchor="middle" fill="#777">左邊的柱子</text><text x="590" y="244" font-size="11" text-anchor="middle" fill="#777">右邊的柱子</text>
<line x1="50" y1="100" x2="120" y2="100" stroke="#333" stroke-width="2"/>
<line x1="120" y1="86" x2="120" y2="114" stroke="#2e6db0" stroke-width="3"/><line x1="142" y1="86" x2="142" y2="114" stroke="#2e6db0" stroke-width="3"/>
<text x="131" y="78" font-size="14" text-anchor="middle" fill="#2e6db0" font-weight="bold">X0</text>
<line x1="142" y1="100" x2="250" y2="100" stroke="#333" stroke-width="2"/>
<line x1="250" y1="86" x2="250" y2="114" stroke="#c0392b" stroke-width="3"/><line x1="272" y1="86" x2="272" y2="114" stroke="#c0392b" stroke-width="3"/>
<line x1="246" y1="114" x2="276" y2="86" stroke="#c0392b" stroke-width="2"/>
<text x="261" y="78" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">X1</text>
<line x1="272" y1="100" x2="460" y2="100" stroke="#333" stroke-width="2"/>
<path d="M466 84 Q456 100 466 116" fill="none" stroke="#333" stroke-width="2.5"/><path d="M494 84 Q504 100 494 116" fill="none" stroke="#333" stroke-width="2.5"/>
<line x1="460" y1="100" x2="462" y2="100" stroke="#333" stroke-width="2"/><line x1="500" y1="100" x2="590" y2="100" stroke="#333" stroke-width="2"/>
<text x="480" y="76" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Y0</text>
<line x1="90" y1="100" x2="90" y2="170" stroke="#2e7d4f" stroke-width="2"/><line x1="172" y1="100" x2="172" y2="170" stroke="#2e7d4f" stroke-width="2"/>
<line x1="90" y1="170" x2="120" y2="170" stroke="#2e7d4f" stroke-width="2"/><line x1="142" y1="170" x2="172" y2="170" stroke="#2e7d4f" stroke-width="2"/>
<line x1="120" y1="156" x2="120" y2="184" stroke="#2e7d4f" stroke-width="3"/><line x1="142" y1="156" x2="142" y2="184" stroke="#2e7d4f" stroke-width="3"/>
<text x="131" y="148" font-size="14" text-anchor="middle" fill="#2e7d4f" font-weight="bold"></text>
<text x="131" y="204" font-size="14" text-anchor="middle" fill="#2e7d4f" font-weight="bold">Y0</text>
<text x="300" y="160" font-size="12" fill="#2e6db0">-| |-  a 接點：按下才通（X0 ＝ 起動按鈕）</text>
<text x="300" y="180" font-size="12" fill="#c0392b">-|/|-  b 接點：平常就通，按下才斷（X1 ＝ 停止按鈕）</text>
<text x="300" y="200" font-size="12" fill="#333">-( )-  線圈：輸出（Y0 ＝ 指示燈）</text>
<text x="300" y="220" font-size="12" fill="#2e7d4f">下面那個 Y0 接點＝Y0 自己幫自己保持</text>
<text x="40" y="276" font-size="13" fill="#333">X 開頭的是「輸入」：按鈕、感測器，告訴 PLC 外面發生了什麼事。</text>
<text x="40" y="298" font-size="13" fill="#333">Y 開頭的是「輸出」：燈、馬達，PLC 決定要不要讓它們動。</text>
<text x="40" y="320" font-size="13" fill="#333">電從左邊的柱子往右流，一路上的接點都通了，右邊的線圈才會有電。</text>
</svg>