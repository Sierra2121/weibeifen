<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<rect width="640" height="250" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">超音波感測器：喊一聲，等回音</text>
<rect x="40" y="70" width="70" height="60" rx="6" fill="#cfe0ea" stroke="#6f8fa3"/><circle cx="62" cy="100" r="12" fill="#fff" stroke="#333"/><circle cx="90" cy="100" r="12" fill="#fff" stroke="#333"/>
<text x="75" y="150" font-size="11" text-anchor="middle" fill="#555">一顆發聲、一顆聽</text>
<path d="M140 85.0 Q155 100 140 115.0" fill="none" stroke="#2e6db0" stroke-width="1.6"/>
<path d="M170 70.0 Q185 100 170 130.0" fill="none" stroke="#2e6db0" stroke-width="1.6"/>
<path d="M200 55.0 Q215 100 200 145.0" fill="none" stroke="#2e6db0" stroke-width="1.6"/>
<rect x="500" y="50" width="30" height="100" fill="#9aa3aa" stroke="#555"/><text x="515" y="166" font-size="11" text-anchor="middle" fill="#555">牆壁／東西</text>
<line x1="115" y1="85" x2="495" y2="85" stroke="#2e6db0" stroke-width="2" stroke-dasharray="6 4"/><text x="300" y="78" font-size="12" text-anchor="middle" fill="#2e6db0">去 →</text>
<line x1="495" y1="115" x2="115" y2="115" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/><text x="300" y="132" font-size="12" text-anchor="middle" fill="#c0392b">← 回來</text>
<rect x="40" y="180" width="560" height="60" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="202" font-size="13" text-anchor="middle" fill="#333">聲音一秒大約跑 343 公尺。聲音要「去」再「回來」，所以要除以 2。</text>
<text x="320" y="224" font-size="13" text-anchor="middle" fill="#333">距離 ＝ 343 × 時間 ÷ 2　例：回音花 0.01 秒 → 343 × 0.01 ÷ 2 ≒ 1.7 公尺</text>
</svg>