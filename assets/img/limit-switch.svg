<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif">
<rect width="640" height="230" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">微動開關（極限開關）：被碰到才會動作</text>
<text x="180" y="54" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">沒被碰到</text>
<rect x="120" y="100" width="120" height="50" rx="4" fill="#cfe0ea" stroke="#333"/>
<line x1="130" y1="100" x2="250" y2="70" stroke="#555" stroke-width="4"/>
<rect x="170" y="86" width="14" height="14" fill="#333"/>
<circle cx="180" cy="180" r="14" fill="#ddd" stroke="#333"/><text x="205" y="185" font-size="12" fill="#555">煞車燈暗</text>
<text x="460" y="54" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">被壓下去</text>
<rect x="400" y="100" width="120" height="50" rx="4" fill="#cfe0ea" stroke="#333"/>
<line x1="410" y1="100" x2="530" y2="104" stroke="#555" stroke-width="4"/>
<rect x="450" y="92" width="14" height="8" fill="#333"/>
<path d="M530 60 L530 88" stroke="#c0392b" stroke-width="2"/><path d="M524 82 L530 90 L536 82" fill="none" stroke="#c0392b" stroke-width="2"/><text x="540" y="70" font-size="11" fill="#c0392b">煞車把手壓下來</text>
<circle cx="460" cy="180" r="14" fill="#e2463a" stroke="#333"/><text x="485" y="185" font-size="12" fill="#555">煞車燈亮</text>
<text x="320" y="220" font-size="12" text-anchor="middle" fill="#777">裡面有一顆很小的按鈕，被彈片壓下去就「喀」一聲接通；工廠也用它來確認「氣壓缸推到底了沒」</text>
</svg>