<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="sans-serif">
<rect width="640" height="280" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">共地：兩個電路要看得懂彼此，0V 要是同一個 0V</text>
<rect x="40" y="60" width="200" height="120" rx="8" fill="#cfe0ea" stroke="#6f8fa3"/><text x="140" y="84" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">PLC 這邊</text><text x="140" y="106" font-size="12" text-anchor="middle" fill="#555">24V 電源 A</text><text x="140" y="160" font-size="12" text-anchor="middle" fill="#555">0V（A 的基準）</text>
<rect x="400" y="60" width="200" height="120" rx="8" fill="#dff0e4" stroke="#2e7d4f"/><text x="500" y="84" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">感測器這邊</text><text x="500" y="106" font-size="12" text-anchor="middle" fill="#555">12V 電源 B</text><text x="500" y="160" font-size="12" text-anchor="middle" fill="#555">0V（B 的基準）</text>
<line x1="240" y1="110" x2="400" y2="110" stroke="#2e6db0" stroke-width="2.5"/><text x="320" y="102" font-size="12" text-anchor="middle" fill="#2e6db0">訊號線：「我現在是 10V」</text>
<line x1="240" y1="160" x2="400" y2="160" stroke="#c0392b" stroke-width="4" stroke-dasharray="8 4"/><text x="320" y="152" font-size="12" text-anchor="middle" fill="#c0392b">共地線：把兩邊的 0V 接在一起</text>
<rect x="40" y="196" width="560" height="74" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="218" font-size="13" text-anchor="middle" fill="#333">電壓是「高低差」，一定要有一個比較的基準。10V 是比誰高 10V？</text>
<text x="320" y="238" font-size="13" text-anchor="middle" fill="#333">沒有共地：兩邊各有各的 0V，PLC 讀到的數字會亂跳</text>
<text x="320" y="258" font-size="13" text-anchor="middle" fill="#c0392b">有共地：大家站在同一個地板上量高度，才看得懂對方</text>
</svg>