<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="sans-serif">
<rect width="640" height="270" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">LED 一定要配一顆電阻</text>
<line x1="80" y1="70" x2="80" y2="110" stroke="#333" stroke-width="2"/><line x1="80" y1="140" x2="80" y2="180" stroke="#333" stroke-width="2"/>
<line x1="64" y1="112" x2="96" y2="112" stroke="#333" stroke-width="3"/><line x1="72" y1="124" x2="88" y2="124" stroke="#333" stroke-width="3"/><line x1="64" y1="136" x2="96" y2="136" stroke="#333" stroke-width="3"/>
<text x="56" y="118" font-size="12" text-anchor="end" fill="#555">USB</text><text x="56" y="134" font-size="12" text-anchor="end" fill="#555">5V</text>
<line x1="80" y1="70" x2="220" y2="70" stroke="#333" stroke-width="2"/>
<rect x="220" y="58" width="60" height="24" fill="#e9d8b4" stroke="#b89d6a"/><text x="250" y="50" font-size="12" text-anchor="middle" fill="#555">電阻 220Ω</text>
<line x1="280" y1="70" x2="400" y2="70" stroke="#333" stroke-width="2"/>
<path d="M400 54 L400 86 L432 70 Z" fill="#f7d74a" stroke="#333" stroke-width="2"/><line x1="432" y1="54" x2="432" y2="86" stroke="#333" stroke-width="2.5"/>
<path d="M420 44 l10 -10 M430 48 l10 -10" stroke="#c9a227" stroke-width="2"/>
<text x="416" y="106" font-size="12" text-anchor="middle" fill="#555">LED（三角形指的方向＝電流走的方向）</text>
<line x1="432" y1="70" x2="540" y2="70" stroke="#333" stroke-width="2"/><line x1="540" y1="70" x2="540" y2="180" stroke="#333" stroke-width="2"/><line x1="80" y1="180" x2="540" y2="180" stroke="#333" stroke-width="2"/>
<text x="400" y="46" font-size="11" text-anchor="end" fill="#555">長腳（正）</text><text x="436" y="46" font-size="11" fill="#555">短腳（負）</text>
<rect x="60" y="200" width="520" height="60" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="222" font-size="13" text-anchor="middle" fill="#333">LED 自己會吃掉大約 2V，剩下 5 − 2 ＝ 3V 要給電阻</text>
<text x="320" y="244" font-size="13" text-anchor="middle" fill="#333">電流 ＝ 3V ÷ 220Ω ≒ 0.014A ＝ 14mA（LED 很安全，不會燒掉）</text>
</svg>