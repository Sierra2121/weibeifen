<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif">
<rect width="640" height="330" fill="#fbfaf7"/>
<text x="160" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#c0392b">串聯：排成一條，一顆壞全部暗</text>
<line x1="26" y1="103" x2="54" y2="103" stroke="#333" stroke-width="3"/><line x1="33" y1="115" x2="47" y2="115" stroke="#333" stroke-width="3"/><line x1="26" y1="127" x2="54" y2="127" stroke="#333" stroke-width="3"/>
<line x1="40" y1="60" x2="40" y2="103" stroke="#333" stroke-width="2"/><line x1="40" y1="127" x2="40" y2="170" stroke="#333" stroke-width="2"/>
<line x1="40" y1="60" x2="280" y2="60" stroke="#333" stroke-width="2"/><line x1="280" y1="60" x2="280" y2="170" stroke="#333" stroke-width="2"/><line x1="40" y1="170" x2="280" y2="170" stroke="#333" stroke-width="2"/>
<circle cx="100" cy="60" r="15" fill="#ddd" stroke="#333" stroke-width="1.8"/><path d="M90 50 L110 70 M110 50 L90 70" stroke="#333" stroke-width="1.2"/>
<circle cx="160" cy="60" r="15" fill="#ddd" stroke="#333" stroke-width="1.8"/><path d="M150 50 L170 70 M170 50 L150 70" stroke="#333" stroke-width="1.2"/>
<circle cx="220" cy="60" r="15" fill="#ddd" stroke="#333" stroke-width="1.8"/><path d="M210 50 L230 70 M230 50 L210 70" stroke="#333" stroke-width="1.2"/>
<text x="160" y="94" font-size="20" text-anchor="middle" fill="#c0392b">✕</text><text x="160" y="112" font-size="11" text-anchor="middle" fill="#c0392b">中間這顆燒斷</text>
<text x="160" y="200" font-size="12" text-anchor="middle" fill="#333">電只有一條路，一定要經過每一顆燈</text>
<text x="160" y="218" font-size="12" text-anchor="middle" fill="#333">一顆斷了 → 整條路斷了 → 全部都不亮</text>
<text x="160" y="236" font-size="12" text-anchor="middle" fill="#333">電壓被三顆分掉，每顆都比較暗</text>
<text x="480" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e7d4f">並聯：各走各的路，一顆壞其他照亮</text>
<line x1="346" y1="103" x2="374" y2="103" stroke="#333" stroke-width="3"/><line x1="353" y1="115" x2="367" y2="115" stroke="#333" stroke-width="3"/><line x1="346" y1="127" x2="374" y2="127" stroke="#333" stroke-width="3"/>
<line x1="360" y1="60" x2="360" y2="103" stroke="#333" stroke-width="2"/><line x1="360" y1="127" x2="360" y2="170" stroke="#333" stroke-width="2"/>
<line x1="360" y1="60" x2="600" y2="60" stroke="#333" stroke-width="2"/><line x1="360" y1="170" x2="600" y2="170" stroke="#333" stroke-width="2"/>
<line x1="440" y1="60" x2="440" y2="100" stroke="#333" stroke-width="2"/><line x1="440" y1="130" x2="440" y2="170" stroke="#333" stroke-width="2"/>
<circle cx="440" cy="115" r="15" fill="#f7d74a" stroke="#333" stroke-width="1.8"/><path d="M430 105 L450 125 M450 105 L430 125" stroke="#333" stroke-width="1.2"/>
<line x1="520" y1="60" x2="520" y2="100" stroke="#333" stroke-width="2"/><line x1="520" y1="130" x2="520" y2="170" stroke="#333" stroke-width="2"/>
<circle cx="520" cy="115" r="15" fill="#ddd" stroke="#333" stroke-width="1.8"/><path d="M510 105 L530 125 M530 105 L510 125" stroke="#333" stroke-width="1.2"/>
<line x1="600" y1="60" x2="600" y2="100" stroke="#333" stroke-width="2"/><line x1="600" y1="130" x2="600" y2="170" stroke="#333" stroke-width="2"/>
<circle cx="600" cy="115" r="15" fill="#f7d74a" stroke="#333" stroke-width="1.8"/><path d="M590 105 L610 125 M610 105 L590 125" stroke="#333" stroke-width="1.2"/>
<text x="520" y="152" font-size="20" text-anchor="middle" fill="#c0392b">✕</text>
<text x="480" y="200" font-size="12" text-anchor="middle" fill="#333">每一顆燈都有自己的一條路，直接接到電源兩端</text>
<text x="480" y="218" font-size="12" text-anchor="middle" fill="#333">一顆斷了 → 只斷它自己那條 → 其他照樣亮</text>
<text x="480" y="236" font-size="12" text-anchor="middle" fill="#333">每顆都拿到完整的電壓，一樣亮</text>
<rect x="70" y="262" width="500" height="54" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="284" font-size="14" text-anchor="middle" fill="#333">家裡的插座、電燈，全部都是並聯</text>
<text x="320" y="304" font-size="13" text-anchor="middle" fill="#555">所以客廳的燈壞了，冰箱跟電視還是可以用</text>
</svg>