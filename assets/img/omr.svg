<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="sans-serif">
<rect width="640" height="240" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">答案卡怎麼被讀出來：跟循跡車一樣，看反光</text>
<text x="100" y="56" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">塗滿</text>
<rect x="78" y="70" width="44" height="22" rx="10" fill="#fff" stroke="#c0392b"/>
<rect x="80" y="72" width="40" height="18" rx="9" fill="#222" fill-opacity="1.0"/>
<text x="100" y="118" font-size="11" text-anchor="middle" fill="#555">反光很少 → 判斷「有塗」</text>
<text x="250" y="56" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">沒塗</text>
<rect x="228" y="70" width="44" height="22" rx="10" fill="#fff" stroke="#c0392b"/>
<text x="250" y="118" font-size="11" text-anchor="middle" fill="#555">反光很多 → 判斷「沒塗」</text>
<text x="400" y="56" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">塗太淡</text>
<rect x="378" y="70" width="44" height="22" rx="10" fill="#fff" stroke="#c0392b"/>
<rect x="380" y="72" width="40" height="18" rx="9" fill="#222" fill-opacity="0.35"/>
<text x="400" y="118" font-size="11" text-anchor="middle" fill="#555">反光不夠少 → 可能讀不到</text>
<text x="550" y="56" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">塗出格</text>
<rect x="528" y="70" width="44" height="22" rx="10" fill="#fff" stroke="#c0392b"/>
<rect x="530" y="72" width="40" height="18" rx="9" fill="#222" fill-opacity="1.0"/>
<ellipse cx="550" cy="81" rx="30" ry="16" fill="#222" fill-opacity="0.8"/>
<text x="550" y="118" font-size="11" text-anchor="middle" fill="#555">旁邊也變暗 → 可能被當成兩個</text>
<rect x="40" y="140" width="560" height="86" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="164" font-size="13" text-anchor="middle" fill="#333">閱卡機打光在答案卡上，一格一格看反射回來的光有多少</text>
<text x="320" y="186" font-size="13" text-anchor="middle" fill="#333">2B 鉛筆的筆芯是石墨，黑黑的，會把光吸走 → 跟循跡車的黑線一樣</text>
<text x="320" y="208" font-size="13" text-anchor="middle" fill="#c0392b">所以要用 2B、要塗滿、要塗在格子裡，橡皮擦要擦乾淨</text>
</svg>