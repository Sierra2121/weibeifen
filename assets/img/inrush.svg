<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif">
<rect width="640" height="230" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">馬達的啟動電流：一開始會衝很高</text>
<line x1="60" y1="180" x2="600" y2="180" stroke="#333" stroke-width="2"/><line x1="60" y1="40" x2="60" y2="180" stroke="#333" stroke-width="2"/>
<text x="40" y="44" font-size="11" fill="#555">電流</text><text x="590" y="198" font-size="11" fill="#555">時間</text>
<path d="M60 180 L80 180 L84 50 C110 60 140 130 200 150 L600 150" fill="none" stroke="#c0392b" stroke-width="3"/>
<line x1="60" y1="150" x2="600" y2="150" stroke="#2e6db0" stroke-width="1" stroke-dasharray="5 4"/><text x="560" y="144" font-size="11" fill="#2e6db0">平常轉的時候</text>
<text x="100" y="48" font-size="12" fill="#c0392b">剛按下起動：平常的 5～7 倍</text>
<text x="320" y="214" font-size="12" text-anchor="middle" fill="#333">還沒轉起來時幾乎沒東西擋電 → 電流一瞬間衝很大 → 旁邊的電壓被拉低</text>
</svg>