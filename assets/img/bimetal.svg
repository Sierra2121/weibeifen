<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<rect width="640" height="250" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">雙金屬片：兩種金屬黏在一起，熱了就會彎</text>
<text x="160" y="56" font-size="13" text-anchor="middle" fill="#2e6db0" font-weight="bold">冷的時候：直的，接點碰在一起</text>
<rect x="60" y="80" width="180" height="8" fill="#9aa3aa"/><rect x="60" y="88" width="180" height="8" fill="#c97d3a"/><rect x="40" y="70" width="20" height="40" fill="#555"/>
<circle cx="244" cy="92" r="6" fill="#c9a227" stroke="#333"/><circle cx="256" cy="92" r="6" fill="#c9a227" stroke="#333"/><text x="160" y="128" font-size="12" text-anchor="middle" fill="#2e6db0">通電 → 電暖器發熱</text>
<text x="470" y="56" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold" dy="-6">熱的時候：彎起來，接點分開</text>
<path d="M370 80 Q470 78 540 62" fill="none" stroke="#9aa3aa" stroke-width="8"/><path d="M370 88 Q472 86 544 70" fill="none" stroke="#c97d3a" stroke-width="8"/><rect x="350" y="70" width="20" height="40" fill="#555"/>
<circle cx="548" cy="66" r="6" fill="#c9a227" stroke="#333"/><circle cx="566" cy="92" r="6" fill="#c9a227" stroke="#333"/><text x="470" y="128" font-size="12" text-anchor="middle" fill="#c0392b">斷電 → 停止發熱，冷了又會變直</text>
<text x="60" y="158" font-size="12" fill="#777">■ 上面：鐵，熱了脹得少</text><text x="250" y="158" font-size="12" fill="#c97d3a">■ 下面：銅，熱了脹得多 → 把整片往上推彎</text>
<rect x="40" y="172" width="560" height="66" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="194" font-size="13" text-anchor="middle" fill="#333">金屬受熱會變長（熱膨脹），可是每一種金屬脹的程度不一樣</text>
<text x="320" y="214" font-size="13" text-anchor="middle" fill="#333">脹得多的那片推著脹得少的那片 → 整片往脹得少的那邊彎</text>
<text x="320" y="232" font-size="12" text-anchor="middle" fill="#777">不用電、不用程式，它自己就是一個「溫度開關」</text>
</svg>