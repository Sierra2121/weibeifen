<line x1="80" y1="80" x2="80" y2="120" stroke="#2e7d4f" stroke-width="2"/><line x1="140" y1="80" x2="140" y2="120" stroke="#2e7d4f" stroke-width="2"/><line x1="80" y1="120" x2="100" y2="120" stroke="#2e7d4f" stroke-width="2"/><line x1="120" y1="120" x2="140" y2="120" stroke="#2e7d4f" stroke-width="2"/>
