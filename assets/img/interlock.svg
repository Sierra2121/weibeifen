<line x1="510" y1="195" x2="600" y2="195" stroke="#333" stroke-width="2"/>
<text x="560" y="187" font-size="12" text-anchor="middle" fill="#555">反轉</text>
<line x1="80" y1="195" x2="80" y2="235" stroke="#2e7d4f" stroke-width="2"/><line x1="140" y1="195" x2="140" y2="235" stroke="#2e7d4f" stroke-width="2"/><line x1="80" y1="235" x2="100" y2="235" stroke="#2e7d4f" stroke-width="2"/><line x1="120" y1="235" x2="140" y2="235" stroke="#2e7d4f" stroke-width="2"/>
<line x1="100" y1="223" x2="100" y2="247" stroke="#2e7d4f" stroke-width="3"/><line x1="120" y1="223" x2="120" y2="247" stroke="#2e7d4f" stroke-width="3"/><text x="110" y="263" font-size="11" text-anchor="middle" fill="#2e7d4f">Y1（自保）</text>
<text x="340" y="135" font-size="12" text-anchor="middle" fill="#c0392b">紅色的 b 接點＝互鎖</text>
<text x="40" y="294" font-size="13" fill="#333">X0＝正轉按鈕　X1＝反轉按鈕　X2＝停止按鈕　Y0＝正轉接觸器　Y1＝反轉接觸器</text>
<text x="40" y="316" font-size="13" fill="#c0392b">正轉那一行，串了一個「Y1 的 b 接點」：只要反轉在動，正轉這條路就是斷的。</text>
<text x="40" y="338" font-size="13" fill="#c0392b">反轉那一行，串了一個「Y0 的 b 接點」：只要正轉在動，反轉這條路就是斷的。</text>
<text x="40" y="360" font-size="13" fill="#333">兩個互相擋住對方，所以永遠不會同時動。要換方向，一定要先按停止。</text>
</svg>