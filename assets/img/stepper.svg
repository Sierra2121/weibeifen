<rect x="290" y="50" width="320" height="150" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="450" y="78" font-size="13" text-anchor="middle" fill="#333">給它一個「脈波」（電一下），它就轉一步</text>
<text x="450" y="104" font-size="13" text-anchor="middle" fill="#333">實習課的步進馬達：一步 1.8 度</text>
<text x="450" y="130" font-size="13" text-anchor="middle" fill="#333">360 ÷ 1.8 ＝ 200 步，剛好一圈</text>
<text x="450" y="156" font-size="13" text-anchor="middle" fill="#333">給 50 個脈波 → 轉 90 度（四分之一圈）</text>
<text x="450" y="182" font-size="13" text-anchor="middle" fill="#c0392b">不用感測器，數脈波就知道轉到哪裡</text>
<text x="450" y="230" font-size="11" text-anchor="middle" fill="#777">（可是負載太重、跳太快，它可能會「失步」，少走了它也不知道）</text>
