<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="sans-serif">
<rect width="640" height="290" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">Y-Δ 降壓起動：先用 Y 慢慢起來，再換成 Δ 全力跑</text>
<line x1="160" y1="140" x2="160" y2="70" stroke="#2e6db0" stroke-width="5" stroke-linecap="round"/>
<circle cx="160" cy="70" r="5" fill="#333"/>
<line x1="160" y1="140" x2="98" y2="180" stroke="#2e6db0" stroke-width="5" stroke-linecap="round"/>
<circle cx="98" cy="180" r="5" fill="#333"/>
<line x1="160" y1="140" x2="222" y2="180" stroke="#2e6db0" stroke-width="5" stroke-linecap="round"/>
<circle cx="222" cy="180" r="5" fill="#333"/>
<circle cx="160" cy="140" r="5" fill="#333"/>
<text x="170" y="64" font-size="13" fill="#333">R</text>
<text x="80" y="174" font-size="13" fill="#333">S</text>
<text x="232" y="174" font-size="13" fill="#333">T</text>
<text x="160" y="54" font-size="14" text-anchor="middle" fill="#2e6db0" font-weight="bold">① 起動：Y 接法</text>
<text x="160" y="214" font-size="12" text-anchor="middle" fill="#333">三個線圈的一頭接在一起</text><text x="160" y="232" font-size="12" text-anchor="middle" fill="#333">每個線圈只分到約 58% 的電壓</text><text x="160" y="250" font-size="12" text-anchor="middle" fill="#2e6db0">啟動電流只有直接起動的約 1/3</text>
<text x="320" y="128" font-size="12" text-anchor="middle" fill="#555">計時器數 5 秒</text><line x1="270" y1="140" x2="370" y2="140" stroke="#555" stroke-width="2"/><path d="M362 134 L370 140 L362 146" fill="none" stroke="#555" stroke-width="2"/>
<text x="320" y="166" font-size="11" text-anchor="middle" fill="#c0392b">Y 跟 Δ 互鎖</text><text x="320" y="182" font-size="11" text-anchor="middle" fill="#c0392b">不能同時接</text>
<line x1="480" y1="70" x2="410" y2="185" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
<line x1="410" y1="185" x2="550" y2="185" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
<line x1="550" y1="185" x2="480" y2="70" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
<circle cx="480" cy="70" r="5" fill="#333"/><text x="490" y="64" font-size="13" fill="#333">R</text>
<circle cx="410" cy="185" r="5" fill="#333"/><text x="392" y="179" font-size="13" fill="#333">S</text>
<circle cx="550" cy="185" r="5" fill="#333"/><text x="560" y="179" font-size="13" fill="#333">T</text>
<text x="480" y="54" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">② 運轉：Δ 接法</text>
<text x="480" y="214" font-size="12" text-anchor="middle" fill="#333">三個線圈頭尾相接，圍成三角形</text><text x="480" y="232" font-size="12" text-anchor="middle" fill="#333">每個線圈拿到完整的電壓</text><text x="480" y="250" font-size="12" text-anchor="middle" fill="#c0392b">力氣最大，正常工作</text>
<text x="320" y="280" font-size="12" text-anchor="middle" fill="#777">要用三個電磁接觸器：主接觸器、Y 接觸器、Δ 接觸器，加一個計時器</text>
</svg>