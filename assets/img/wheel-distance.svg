<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif">
<rect width="640" height="260" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">輪子轉一圈，車子走多遠？</text>
<circle cx="140" cy="120" r="60" fill="#e4e7ea" stroke="#333" stroke-width="3"/><circle cx="140" cy="120" r="6" fill="#333"/>
<line x1="80" y1="120" x2="200" y2="120" stroke="#c0392b" stroke-width="2"/><text x="140" y="112" font-size="12" text-anchor="middle" fill="#c0392b">直徑 D ＝ 56.00 mm</text>
<line x1="80" y1="182" x2="80+0" y2="182" stroke="#333"/>
<line x1="80" y1="190" x2="580" y2="190" stroke="#333" stroke-width="2"/>
<path d="M140 182 L140 198" stroke="#2e6db0" stroke-width="2"/><path d="M316 182 L316 198" stroke="#2e6db0" stroke-width="2"/>
<line x1="140" y1="205" x2="316" y2="205" stroke="#2e6db0" stroke-width="2"/><text x="228" y="222" font-size="12" text-anchor="middle" fill="#2e6db0">滾一圈＝圓周長 ＝ π × D ≒ 3.14 × 56 ≒ 175.9 mm</text>
<rect x="340" y="60" width="270" height="90" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="475" y="84" font-size="13" text-anchor="middle" fill="#333">馬達裡的編碼器會數「轉了幾度」</text>
<text x="475" y="106" font-size="13" text-anchor="middle" fill="#333">要走 500 mm → 500 ÷ 175.9 ≒ 2.84 圈</text>
<text x="475" y="128" font-size="13" text-anchor="middle" fill="#333">2.84 × 360 度 ≒ 1023 度</text>
<text x="320" y="250" font-size="12" text-anchor="middle" fill="#777">輪子直徑量錯 1 mm，走 1 公尺就會差將近 2 公分</text>
</svg>