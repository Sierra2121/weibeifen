<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif">
<rect width="640" height="260" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">顏色感測器：打白光，看三種顏色各彈回來多少</text>
<rect x="40" y="70" width="90" height="60" rx="6" fill="#cfe0ea" stroke="#6f8fa3"/><text x="85" y="96" font-size="12" text-anchor="middle" fill="#333">顏色感測器</text><text x="85" y="114" font-size="11" text-anchor="middle" fill="#555">白光＋三種濾鏡</text>
<line x1="130" y1="90" x2="250" y2="90" stroke="#999" stroke-width="3"/><text x="190" y="82" font-size="11" text-anchor="middle" fill="#777">白光（紅＋綠＋藍）</text>
<rect x="250" y="60" width="70" height="70" fill="#d24a3a" stroke="#333"/><text x="285" y="150" font-size="12" text-anchor="middle" fill="#555">紅色的東西</text>
<line x1="250" y1="112" x2="130" y2="112" stroke="#d24a3a" stroke-width="3"/><text x="190" y="128" font-size="11" text-anchor="middle" fill="#d24a3a">只彈回紅光</text>
<text x="380" y="74" font-size="12" fill="#333">紅 R</text><rect x="420" y="62" width="160.0" height="16" fill="#d24a3a"/><text x="584.0" y="74" font-size="11" fill="#555">200</text>
<text x="380" y="100" font-size="12" fill="#333">綠 G</text><rect x="420" y="88" width="24.0" height="16" fill="#3a9a5a"/><text x="448.0" y="100" font-size="11" fill="#555">30</text>
<text x="380" y="126" font-size="12" fill="#333">藍 B</text><rect x="420" y="114" width="20.0" height="16" fill="#3a6ad2"/><text x="444.0" y="126" font-size="11" fill="#555">25</text>
<text x="500" y="160" font-size="11" text-anchor="middle" fill="#555">感測器讀到的數字（0～255）</text>
<rect x="40" y="180" width="560" height="66" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="202" font-size="13" text-anchor="middle" fill="#333">東西會「吃掉」別的顏色，只把自己的顏色彈回來，我們才會看到那個顏色</text>
<text x="320" y="222" font-size="13" text-anchor="middle" fill="#333">紅色最多 → 判斷是紅的；三種都很多 → 白的；三種都很少 → 黑的</text>
<text x="320" y="240" font-size="12" text-anchor="middle" fill="#777">燈光一變，數字就會跟著變，所以每次都要先校正</text>
</svg>