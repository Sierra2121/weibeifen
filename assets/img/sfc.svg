<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="sans-serif">
<rect width="640" height="560" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">順序功能流程圖（SFC）：洗衣機</text>
<rect x="204" y="44" width="132" height="52" fill="none" stroke="#333" stroke-width="2"/>
<rect x="210" y="50" width="120" height="40" fill="#cfe0ea" stroke="#333" stroke-width="2"/>
<text x="270" y="67" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">S0</text><text x="270" y="83" font-size="12" text-anchor="middle" fill="#333">等待（初始步）</text>
<line x1="270" y1="90" x2="270" y2="142" stroke="#333" stroke-width="2"/>
<line x1="250" y1="116" x2="290" y2="116" stroke="#c0392b" stroke-width="3"/>
<text x="240" y="121" font-size="12" text-anchor="end" fill="#c0392b">按下開始 X0</text>
<rect x="210" y="142" width="120" height="40" fill="#cfe0ea" stroke="#333" stroke-width="2"/>
<text x="270" y="159" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">S20</text><text x="270" y="175" font-size="12" text-anchor="middle" fill="#333">注水</text>
<line x1="330" y1="162" x2="370" y2="162" stroke="#333" stroke-width="1.5"/><rect x="370" y="146" width="170" height="32" fill="#fff" stroke="#999"/><text x="455" y="167" font-size="12" text-anchor="middle" fill="#2e7d4f">Y0 進水閥打開</text>
<line x1="270" y1="182" x2="270" y2="234" stroke="#333" stroke-width="2"/>
<line x1="250" y1="208" x2="290" y2="208" stroke="#c0392b" stroke-width="3"/>
<text x="240" y="213" font-size="12" text-anchor="end" fill="#c0392b">水位到了 X1</text>
<rect x="210" y="234" width="120" height="40" fill="#cfe0ea" stroke="#333" stroke-width="2"/>
<text x="270" y="251" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">S21</text><text x="270" y="267" font-size="12" text-anchor="middle" fill="#333">洗衣</text>
<line x1="330" y1="254" x2="370" y2="254" stroke="#333" stroke-width="1.5"/><rect x="370" y="238" width="170" height="32" fill="#fff" stroke="#999"/><text x="455" y="259" font-size="12" text-anchor="middle" fill="#2e7d4f">Y1 馬達正逆轉</text>
<line x1="270" y1="274" x2="270" y2="326" stroke="#333" stroke-width="2"/>
<line x1="250" y1="300" x2="290" y2="300" stroke="#c0392b" stroke-width="3"/>
<text x="240" y="305" font-size="12" text-anchor="end" fill="#c0392b">計時 10 分鐘 T0</text>
<rect x="210" y="326" width="120" height="40" fill="#cfe0ea" stroke="#333" stroke-width="2"/>
<text x="270" y="343" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">S22</text><text x="270" y="359" font-size="12" text-anchor="middle" fill="#333">排水</text>
<line x1="330" y1="346" x2="370" y2="346" stroke="#333" stroke-width="1.5"/><rect x="370" y="330" width="170" height="32" fill="#fff" stroke="#999"/><text x="455" y="351" font-size="12" text-anchor="middle" fill="#2e7d4f">Y2 排水閥打開</text>
<line x1="270" y1="366" x2="270" y2="418" stroke="#333" stroke-width="2"/>
<line x1="250" y1="392" x2="290" y2="392" stroke="#c0392b" stroke-width="3"/>
<text x="240" y="397" font-size="12" text-anchor="end" fill="#c0392b">水排完 X2</text>
<rect x="210" y="418" width="120" height="40" fill="#cfe0ea" stroke="#333" stroke-width="2"/>
<text x="270" y="435" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">S23</text><text x="270" y="451" font-size="12" text-anchor="middle" fill="#333">脫水</text>
<line x1="330" y1="438" x2="370" y2="438" stroke="#333" stroke-width="1.5"/><rect x="370" y="422" width="170" height="32" fill="#fff" stroke="#999"/><text x="455" y="443" font-size="12" text-anchor="middle" fill="#2e7d4f">Y3 高速轉</text>
<line x1="270" y1="458" x2="270" y2="510" stroke="#333" stroke-width="2"/>
<line x1="250" y1="484" x2="290" y2="484" stroke="#c0392b" stroke-width="3"/>
<text x="240" y="489" font-size="12" text-anchor="end" fill="#c0392b">計時 5 分鐘 T1 → 回到 S0</text>
<line x1="270" y1="510" x2="270" y2="518" stroke="#333" stroke-width="2"/><line x1="270" y1="518" x2="150" y2="518" stroke="#333" stroke-width="2"/><line x1="150" y1="518" x2="150" y2="70" stroke="#333" stroke-width="2"/><line x1="150" y1="70" x2="204" y2="70" stroke="#333" stroke-width="2"/>
<text x="40" y="550" font-size="12" fill="#333">方塊＝步驟（一次只有一個步驟在動作）　紅線＝轉移條件（條件成立，才能走到下一步）</text>
</svg>