<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif">
<rect width="640" height="260" fill="#fbfaf7"/>
<text x="150" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e7d4f">閉合迴路：燈會亮</text>
<line x1="50" y1="60" x2="50" y2="110" stroke="#333" stroke-width="2"/><line x1="50" y1="140" x2="50" y2="190" stroke="#333" stroke-width="2"/>
<line x1="34" y1="112" x2="66" y2="112" stroke="#333" stroke-width="3"/><line x1="42" y1="124" x2="58" y2="124" stroke="#333" stroke-width="3"/><line x1="34" y1="136" x2="66" y2="136" stroke="#333" stroke-width="3"/>
<text x="28" y="128" font-size="12" text-anchor="end" fill="#555">電源</text>
<line x1="50" y1="60" x2="250" y2="60" stroke="#333" stroke-width="2"/>
<line x1="250" y1="60" x2="250" y2="102" stroke="#333" stroke-width="2"/><line x1="250" y1="148" x2="250" y2="190" stroke="#333" stroke-width="2"/>
<circle cx="250" cy="125" r="23" fill="#f7d74a" stroke="#333" stroke-width="2"/><path d="M234 109 L266 141 M266 109 L234 141" stroke="#333" stroke-width="1.5"/>
<text x="280" y="130" font-size="12" fill="#555">燈</text>
<line x1="50" y1="190" x2="250" y2="190" stroke="#333" stroke-width="2"/>
<text x="150" y="54" font-size="16" text-anchor="middle" fill="#2e7d4f">→</text>
<text x="250" y="170" font-size="16" text-anchor="middle" fill="#2e7d4f">↓</text>
<text x="150" y="184" font-size="16" text-anchor="middle" fill="#2e7d4f">←</text>
<text x="50" y="80" font-size="16" text-anchor="middle" fill="#2e7d4f">↑</text>
<text x="150" y="218" font-size="12" text-anchor="middle" fill="#2e7d4f">電從電源出去，繞一圈回來</text>
<text x="470" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#c0392b">斷路：燈不亮</text>
<line x1="370" y1="60" x2="370" y2="110" stroke="#333" stroke-width="2"/><line x1="370" y1="140" x2="370" y2="190" stroke="#333" stroke-width="2"/>
<line x1="354" y1="112" x2="386" y2="112" stroke="#333" stroke-width="3"/><line x1="362" y1="124" x2="378" y2="124" stroke="#333" stroke-width="3"/><line x1="354" y1="136" x2="386" y2="136" stroke="#333" stroke-width="3"/>
<text x="348" y="128" font-size="12" text-anchor="end" fill="#555">電源</text>
<line x1="370" y1="60" x2="570" y2="60" stroke="#333" stroke-width="2"/>
<line x1="570" y1="60" x2="570" y2="102" stroke="#333" stroke-width="2"/><line x1="570" y1="148" x2="570" y2="190" stroke="#333" stroke-width="2"/>
<circle cx="570" cy="125" r="23" fill="#ddd" stroke="#333" stroke-width="2"/><path d="M554 109 L586 141 M586 109 L554 141" stroke="#333" stroke-width="1.5"/>
<text x="600" y="130" font-size="12" fill="#555">燈</text>
<line x1="370" y1="190" x2="455" y2="190" stroke="#333" stroke-width="2"/><line x1="485" y1="190" x2="570" y2="190" stroke="#333" stroke-width="2"/>
<text x="470" y="195" font-size="18" text-anchor="middle" fill="#c0392b">✕</text>
<text x="470" y="218" font-size="12" text-anchor="middle" fill="#c0392b">螺絲沒鎖緊，這裡斷了</text>
<text x="320" y="250" font-size="13" text-anchor="middle" fill="#333">電一定要能「繞一圈回到起點」才會流。路上任何一個地方斷掉，整圈都不會有電。</text>
</svg>