<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif">
<rect width="640" height="260" fill="#fbfaf7"/>
<text x="110" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">直走</text>
<rect x="70" y="80" width="80" height="110" rx="10" fill="#cfe0ea" stroke="#6f8fa3"/>
<rect x="52" y="120" width="16" height="40" rx="3" fill="#444"/><rect x="152" y="120" width="16" height="40" rx="3" fill="#444"/>
<circle cx="96" cy="86" r="5" fill="#222"/><circle cx="124" cy="86" r="5" fill="#222"/>
<text x="110" y="108" font-size="11" text-anchor="middle" fill="#555">車頭</text><text x="110" y="122" font-size="10" text-anchor="middle" fill="#555">兩顆感測器</text>
<line x1="60" y1="115" x2="60" y2="75" stroke="#c0392b" stroke-width="4"/><path d="M54 81 L60 71 L66 81 Z" fill="#c0392b"/>
<line x1="160" y1="115" x2="160" y2="75" stroke="#c0392b" stroke-width="4"/><path d="M154 81 L160 71 L166 81 Z" fill="#c0392b"/>
<text x="110" y="215" font-size="13" text-anchor="middle" fill="#333">左右輪一樣快</text>
<text x="110" y="235" font-size="13" text-anchor="middle" fill="#333">→ 直直往前</text>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">左轉</text>
<rect x="280" y="80" width="80" height="110" rx="10" fill="#cfe0ea" stroke="#6f8fa3"/>
<rect x="262" y="120" width="16" height="40" rx="3" fill="#444"/><rect x="362" y="120" width="16" height="40" rx="3" fill="#444"/>
<circle cx="306" cy="86" r="5" fill="#222"/><circle cx="334" cy="86" r="5" fill="#222"/>
<text x="320" y="108" font-size="11" text-anchor="middle" fill="#555">車頭</text><text x="320" y="122" font-size="10" text-anchor="middle" fill="#555">兩顆感測器</text>
<line x1="270" y1="115" x2="270" y2="100" stroke="#c0392b" stroke-width="4"/><path d="M264 106 L270 96 L276 106 Z" fill="#c0392b"/>
<line x1="370" y1="115" x2="370" y2="70" stroke="#c0392b" stroke-width="4"/><path d="M364 76 L370 66 L376 76 Z" fill="#c0392b"/>
<text x="320" y="215" font-size="13" text-anchor="middle" fill="#333">左輪慢、右輪快</text>
<text x="320" y="235" font-size="13" text-anchor="middle" fill="#333">→ 車頭往左偏</text>
<text x="530" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">右轉</text>
<rect x="490" y="80" width="80" height="110" rx="10" fill="#cfe0ea" stroke="#6f8fa3"/>
<rect x="472" y="120" width="16" height="40" rx="3" fill="#444"/><rect x="572" y="120" width="16" height="40" rx="3" fill="#444"/>
<circle cx="516" cy="86" r="5" fill="#222"/><circle cx="544" cy="86" r="5" fill="#222"/>
<text x="530" y="108" font-size="11" text-anchor="middle" fill="#555">車頭</text><text x="530" y="122" font-size="10" text-anchor="middle" fill="#555">兩顆感測器</text>
<line x1="480" y1="115" x2="480" y2="70" stroke="#c0392b" stroke-width="4"/><path d="M474 76 L480 66 L486 76 Z" fill="#c0392b"/>
<line x1="580" y1="115" x2="580" y2="100" stroke="#c0392b" stroke-width="4"/><path d="M574 106 L580 96 L586 106 Z" fill="#c0392b"/>
<text x="530" y="215" font-size="13" text-anchor="middle" fill="#333">左輪快、右輪慢</text>
<text x="530" y="235" font-size="13" text-anchor="middle" fill="#333">→ 車頭往右偏</text>
<text x="320" y="255" font-size="12" text-anchor="middle" fill="#777">紅色箭頭越長＝那一邊的輪子轉越快</text>
</svg>