<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
<rect width="640" height="360" fill="#fbfaf7"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#2e7d4f">兩個開關都扳到同一條線：路通了，燈亮</text>
<text x="20" y="90" font-size="12" fill="#555">電源</text>
<line x1="56" y1="85" x2="120" y2="85" stroke="#333" stroke-width="2"/>
<line x1="170" y1="60" x2="370" y2="60" stroke="#2e6db0" stroke-width="2"/>
<circle cx="170" cy="60" r="4" fill="#333"/><circle cx="370" cy="60" r="4" fill="#333"/>
<line x1="170" y1="110" x2="370" y2="110" stroke="#2e6db0" stroke-width="2"/>
<circle cx="170" cy="110" r="4" fill="#333"/><circle cx="370" cy="110" r="4" fill="#333"/>
<text x="270" y="54" font-size="11" text-anchor="middle" fill="#2e6db0">第 1 條連接線</text><text x="270" y="126" font-size="11" text-anchor="middle" fill="#2e6db0">第 2 條連接線</text>
<circle cx="120" cy="85" r="4" fill="#333"/><circle cx="420" cy="85" r="4" fill="#333"/>
<line x1="120" y1="85" x2="168" y2="60" stroke="#c0392b" stroke-width="3"/>
<line x1="420" y1="85" x2="372" y2="60" stroke="#c0392b" stroke-width="3"/>
<text x="140" y="140" font-size="12" text-anchor="middle" fill="#555">樓下開關</text><text x="400" y="140" font-size="12" text-anchor="middle" fill="#555">樓上開關</text>
<line x1="420" y1="85" x2="510" y2="85" stroke="#333" stroke-width="2"/>
<circle cx="535" cy="85" r="22" fill="#f7d74a" stroke="#333" stroke-width="2"/><path d="M520 70 L550 100 M550 70 L520 100" stroke="#333" stroke-width="1.4"/>
<text x="535" y="125" font-size="12" text-anchor="middle" fill="#555">燈亮</text>
<text x="20" y="198" font-size="15" font-weight="bold" fill="#c0392b">樓上的人扳了一下，兩邊選了不同條線：路斷了，燈暗</text>
<text x="20" y="260" font-size="12" fill="#555">電源</text>
<line x1="56" y1="255" x2="120" y2="255" stroke="#333" stroke-width="2"/>
<line x1="170" y1="230" x2="370" y2="230" stroke="#2e6db0" stroke-width="2"/>
<circle cx="170" cy="230" r="4" fill="#333"/><circle cx="370" cy="230" r="4" fill="#333"/>
<line x1="170" y1="280" x2="370" y2="280" stroke="#2e6db0" stroke-width="2"/>
<circle cx="170" cy="280" r="4" fill="#333"/><circle cx="370" cy="280" r="4" fill="#333"/>
<text x="270" y="224" font-size="11" text-anchor="middle" fill="#2e6db0">第 1 條連接線</text><text x="270" y="296" font-size="11" text-anchor="middle" fill="#2e6db0">第 2 條連接線</text>
<circle cx="120" cy="255" r="4" fill="#333"/><circle cx="420" cy="255" r="4" fill="#333"/>
<line x1="120" y1="255" x2="168" y2="230" stroke="#c0392b" stroke-width="3"/>
<line x1="420" y1="255" x2="372" y2="280" stroke="#c0392b" stroke-width="3"/>
<text x="140" y="310" font-size="12" text-anchor="middle" fill="#555">樓下開關</text><text x="400" y="310" font-size="12" text-anchor="middle" fill="#555">樓上開關</text>
<line x1="420" y1="255" x2="510" y2="255" stroke="#333" stroke-width="2"/>
<circle cx="535" cy="255" r="22" fill="#ddd" stroke="#333" stroke-width="2"/><path d="M520 240 L550 270 M550 240 L520 270" stroke="#333" stroke-width="1.4"/>
<text x="535" y="295" font-size="12" text-anchor="middle" fill="#555">燈暗</text>
</svg>