<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<rect width="640" height="250" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">捷運的再生煞車：馬達跟發電機，是同一顆</text>
<rect x="40" y="45" width="260" height="140" rx="10" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="170" y="70" font-size="14" text-anchor="middle" fill="#2e6db0" font-weight="bold">加速的時候</text>
<circle cx="170" cy="120" r="30" fill="#cfe0ea" stroke="#333" stroke-width="2"/><text x="170" y="125" font-size="12" text-anchor="middle" fill="#333">馬達</text>
<text x="170" y="168" font-size="12" text-anchor="middle" fill="#2e6db0">電線 → 馬達</text><text x="170" y="184" font-size="12" text-anchor="middle" fill="#555">電變成轉，車子跑起來</text>
<rect x="340" y="45" width="260" height="140" rx="10" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="470" y="70" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">煞車的時候</text>
<circle cx="470" cy="120" r="30" fill="#cfe0ea" stroke="#333" stroke-width="2"/><text x="470" y="125" font-size="12" text-anchor="middle" fill="#333">馬達</text>
<text x="470" y="168" font-size="12" text-anchor="middle" fill="#c0392b">車輪 → 馬達</text><text x="470" y="184" font-size="12" text-anchor="middle" fill="#555">轉變成電，送回電線</text>
<text x="320" y="214" font-size="13" text-anchor="middle" fill="#333">車子要停下來，就讓馬達「變成發電機」：車輪推著馬達轉，馬達發電，同時被拖慢</text>
<text x="320" y="236" font-size="13" text-anchor="middle" fill="#333">發出來的電送回電線，給後面加速的列車用 → 煞車的力氣沒有浪費掉</text>
</svg>