<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<rect width="640" height="250" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">人機介面（HMI）：人 ↔ 螢幕 ↔ PLC ↔ 機器</text>
<rect x="30" y="70" width="120" height="70" rx="8" fill="#cfe0ea" stroke="#6f8fa3"/><text x="90" y="100" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">人</text><text x="90" y="122" font-size="12" text-anchor="middle" fill="#555">用手指按</text>
<rect x="170" y="70" width="120" height="70" rx="8" fill="#cfe0ea" stroke="#6f8fa3"/><text x="230" y="100" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">觸控螢幕</text><text x="230" y="122" font-size="12" text-anchor="middle" fill="#555">HMI</text>
<rect x="330" y="70" width="120" height="70" rx="8" fill="#cfe0ea" stroke="#6f8fa3"/><text x="390" y="100" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">PLC</text><text x="390" y="122" font-size="12" text-anchor="middle" fill="#555">照程式決定</text>
<rect x="480" y="70" width="120" height="70" rx="8" fill="#cfe0ea" stroke="#6f8fa3"/><text x="540" y="100" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">機器</text><text x="540" y="122" font-size="12" text-anchor="middle" fill="#555">馬達、閥、燈</text>
<line x1="150" y1="95" x2="170" y2="95" stroke="#2e6db0" stroke-width="2"/><path d="M164 90 L170 95 L164 100" fill="none" stroke="#2e6db0" stroke-width="2"/>
<line x1="170" y1="115" x2="150" y2="115" stroke="#c0392b" stroke-width="2"/><path d="M156 110 L150 115 L156 120" fill="none" stroke="#c0392b" stroke-width="2"/>
<line x1="290" y1="95" x2="330" y2="95" stroke="#2e6db0" stroke-width="2"/><path d="M324 90 L330 95 L324 100" fill="none" stroke="#2e6db0" stroke-width="2"/>
<line x1="330" y1="115" x2="290" y2="115" stroke="#c0392b" stroke-width="2"/><path d="M296 110 L290 115 L296 120" fill="none" stroke="#c0392b" stroke-width="2"/>
<line x1="450" y1="95" x2="480" y2="95" stroke="#2e6db0" stroke-width="2"/><path d="M474 90 L480 95 L474 100" fill="none" stroke="#2e6db0" stroke-width="2"/>
<line x1="480" y1="115" x2="450" y2="115" stroke="#c0392b" stroke-width="2"/><path d="M456 110 L450 115 L456 120" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="320" y="170" font-size="13" text-anchor="middle" fill="#2e6db0">藍色：螢幕上的按鈕 → 告訴 PLC「有人按了」（就像實體的起動按鈕）</text>
<text x="320" y="194" font-size="13" text-anchor="middle" fill="#c0392b">紅色：PLC 裡的數字 → 顯示在螢幕上（計數器數到幾、溫度幾度、機器在不在跑）</text>
<text x="320" y="226" font-size="12" text-anchor="middle" fill="#777">以前要一整排按鈕和指示燈，現在一塊螢幕就做得到，要改畫面也不用重新接線</text>
</svg>