<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<rect width="640" height="250" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">腳踏車的齒輪比：快，還是輕？</text>
<text x="170" y="54" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">前大後小</text>
<circle cx="110" cy="120" r="50" fill="none" stroke="#333" stroke-width="3"/><circle cx="240" cy="120" r="20" fill="none" stroke="#333" stroke-width="3"/>
<line x1="110" y1="70" x2="240" y2="100" stroke="#777" stroke-width="2"/><line x1="110" y1="170" x2="240" y2="140" stroke="#777" stroke-width="2"/>
<text x="110" y="190" font-size="11" text-anchor="middle" fill="#555">前齒輪（踩的）</text><text x="240" y="190" font-size="11" text-anchor="middle" fill="#555">後齒輪（接輪子）</text>
<text x="175" y="212" font-size="12" text-anchor="middle" fill="#c0392b">踩一圈，輪子轉很多圈 → 快，但很重</text>
<text x="470" y="54" font-size="14" text-anchor="middle" fill="#2e7d4f" font-weight="bold">前小後大</text>
<circle cx="410" cy="120" r="28" fill="none" stroke="#333" stroke-width="3"/><circle cx="540" cy="120" r="32" fill="none" stroke="#333" stroke-width="3"/>
<line x1="410" y1="92" x2="540" y2="88" stroke="#777" stroke-width="2"/><line x1="410" y1="148" x2="540" y2="152" stroke="#777" stroke-width="2"/>
<text x="410" y="190" font-size="11" text-anchor="middle" fill="#555">前齒輪（踩的）</text><text x="540" y="190" font-size="11" text-anchor="middle" fill="#555">後齒輪（接輪子）</text>
<text x="475" y="212" font-size="12" text-anchor="middle" fill="#2e7d4f">踩一圈，輪子轉比較少 → 慢，但很輕</text>
<text x="320" y="240" font-size="12" text-anchor="middle" fill="#333">齒輪比 ＝ 前齒數 ÷ 後齒數。例：前 48 齒、後 16 齒 → 3，踩一圈，輪子轉 3 圈</text>
</svg>