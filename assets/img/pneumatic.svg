<text x="420.0" y="219" font-size="12" text-anchor="middle" fill="#555">氣壓缸</text>
<rect x="120" y="295" width="130" height="36" rx="4" fill="#cfe0ea" stroke="#6f8fa3"/><text x="185" y="318" font-size="13" text-anchor="middle" fill="#333">電磁閥</text>
<rect x="76" y="299" width="38" height="28" fill="#ddd" stroke="#333"/><text x="95" y="318" font-size="11" text-anchor="middle" fill="#333">沒電</text>
<text x="95" y="343" font-size="11" text-anchor="middle" fill="#555">線圈</text>
<line x1="185" y1="331" x2="185" y2="351" stroke="#2e6db0" stroke-width="3"/><text x="195" y="349" font-size="11" fill="#2e6db0">壓縮空氣進來</text>
<path d="M160 295 L160 281 L338 281 L338 271" fill="none" stroke="#9aa3aa" stroke-width="2"/>
<path d="M210 295 L210 291 L502 291 L502 271" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="20" y="371" font-size="12" fill="#c0392b">彈簧把閥推回原位，空氣改走另一條，灌進氣壓缸的前面，把活塞推回來</text>
</svg>