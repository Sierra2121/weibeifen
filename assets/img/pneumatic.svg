<rect x="484" y="68.0" width="106" height="10" fill="#9aa3aa"/>
<text x="420.0" y="44" font-size="12" text-anchor="middle" fill="#555">氣壓缸</text>
<rect x="120" y="120" width="130" height="36" rx="4" fill="#cfe0ea" stroke="#6f8fa3"/><text x="185" y="143" font-size="13" text-anchor="middle" fill="#333">電磁閥</text>
<rect x="76" y="124" width="38" height="28" fill="#f7d74a" stroke="#333"/><text x="95" y="143" font-size="11" text-anchor="middle" fill="#333">有電</text>
