<path d="M160 120 L160 106 L338 106 L338 96" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M210 120 L210 116 L502 116 L502 96" fill="none" stroke="#9aa3aa" stroke-width="2"/>
<text x="20" y="182" font-size="12" fill="#c0392b">紅色那條在送空氣：壓縮空氣灌進氣壓缸的後面，把活塞往前推</text>
<text x="20" y="203" font-size="15" font-weight="bold" fill="#c0392b">電磁閥線圈沒電 → 活塞桿縮回來</text>
<rect x="330" y="225" width="180" height="46" fill="#e4e7ea" stroke="#6f7a82" stroke-width="2"/>
<rect x="344" y="227" width="14" height="42" fill="#6f7a82"/>
