<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="sans-serif">
<rect width="640" height="270" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">控制箱裡的配線：端子台＋線號＋壓接端子</text>
<rect x="250" y="60" width="140" height="150" rx="4" fill="#e4e7ea" stroke="#6f7a82"/><text x="320" y="228" font-size="12" text-anchor="middle" fill="#555">端子台（一排螺絲座）</text>
<rect x="265" y="75" width="110" height="22" fill="#fff" stroke="#999"/><circle cx="285" cy="86" r="6" fill="#bbb" stroke="#555"/><circle cx="355" cy="86" r="6" fill="#bbb" stroke="#555"/><text x="320" y="90" font-size="11" text-anchor="middle" fill="#333">1</text>
<line x1="100" y1="86" x2="279" y2="86" stroke="#2e6db0" stroke-width="2"/><line x1="361" y1="86" x2="540" y2="86" stroke="#c0392b" stroke-width="2"/>
<rect x="150" y="78" width="34" height="16" rx="3" fill="#fff" stroke="#333"/><text x="167" y="90" font-size="10" text-anchor="middle" fill="#333">X0</text>
<rect x="265" y="102" width="110" height="22" fill="#fff" stroke="#999"/><circle cx="285" cy="113" r="6" fill="#bbb" stroke="#555"/><circle cx="355" cy="113" r="6" fill="#bbb" stroke="#555"/><text x="320" y="117" font-size="11" text-anchor="middle" fill="#333">2</text>
<line x1="100" y1="113" x2="279" y2="113" stroke="#2e6db0" stroke-width="2"/><line x1="361" y1="113" x2="540" y2="113" stroke="#c0392b" stroke-width="2"/>
<rect x="150" y="105" width="34" height="16" rx="3" fill="#fff" stroke="#333"/><text x="167" y="117" font-size="10" text-anchor="middle" fill="#333">X1</text>
<rect x="265" y="129" width="110" height="22" fill="#fff" stroke="#999"/><circle cx="285" cy="140" r="6" fill="#bbb" stroke="#555"/><circle cx="355" cy="140" r="6" fill="#bbb" stroke="#555"/><text x="320" y="144" font-size="11" text-anchor="middle" fill="#333">3</text>
<line x1="100" y1="140" x2="279" y2="140" stroke="#2e6db0" stroke-width="2"/><line x1="361" y1="140" x2="540" y2="140" stroke="#c0392b" stroke-width="2"/>
<rect x="150" y="132" width="34" height="16" rx="3" fill="#fff" stroke="#333"/><text x="167" y="144" font-size="10" text-anchor="middle" fill="#333">X2</text>
<rect x="265" y="156" width="110" height="22" fill="#fff" stroke="#999"/><circle cx="285" cy="167" r="6" fill="#bbb" stroke="#555"/><circle cx="355" cy="167" r="6" fill="#bbb" stroke="#555"/><text x="320" y="171" font-size="11" text-anchor="middle" fill="#333">4</text>
<line x1="100" y1="167" x2="279" y2="167" stroke="#2e6db0" stroke-width="2"/><line x1="361" y1="167" x2="540" y2="167" stroke="#c0392b" stroke-width="2"/>
<rect x="150" y="159" width="34" height="16" rx="3" fill="#fff" stroke="#333"/><text x="167" y="171" font-size="10" text-anchor="middle" fill="#333">X3</text>
<rect x="265" y="183" width="110" height="22" fill="#fff" stroke="#999"/><circle cx="285" cy="194" r="6" fill="#bbb" stroke="#555"/><circle cx="355" cy="194" r="6" fill="#bbb" stroke="#555"/><text x="320" y="198" font-size="11" text-anchor="middle" fill="#333">5</text>
<line x1="100" y1="194" x2="279" y2="194" stroke="#2e6db0" stroke-width="2"/><line x1="361" y1="194" x2="540" y2="194" stroke="#c0392b" stroke-width="2"/>
<rect x="150" y="186" width="34" height="16" rx="3" fill="#fff" stroke="#333"/><text x="167" y="198" font-size="10" text-anchor="middle" fill="#333">X4</text>
<text x="90" y="72" font-size="12" text-anchor="end" fill="#2e6db0">從 PLC 來</text><text x="550" y="72" font-size="12" fill="#c0392b">到感測器</text>
<text x="167" y="222" font-size="11" text-anchor="middle" fill="#333">線號套管：每條線都有名字</text>
<path d="M450 160 l14 -6 l0 12 z" fill="#c9a227" stroke="#333"/><text x="500" y="164" font-size="11" fill="#555">壓接端子（Y 型）</text>
<text x="320" y="252" font-size="12" text-anchor="middle" fill="#333">線不直接接到機器，先接到端子台；每條線兩頭都套線號 → 壞了一查就知道是哪一條</text>
</svg>