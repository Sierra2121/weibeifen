<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<rect width="640" height="250" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">不斷電：停電的那一瞬間，自動換成電池</text>
<rect x="30" y="60" width="120" height="44" rx="6" fill="#cfe0ea" stroke="#6f8fa3"/><text x="90" y="87" font-size="12" text-anchor="middle" fill="#333">牆壁插座</text>
<rect x="30" y="140" width="120" height="44" rx="6" fill="#dff0e4" stroke="#2e7d4f"/><text x="90" y="160" font-size="12" text-anchor="middle" fill="#333">電池</text><text x="90" y="176" font-size="11" text-anchor="middle" fill="#555">平常一直在充電</text>
<rect x="250" y="95" width="130" height="54" rx="6" fill="#fff" stroke="#333"/><text x="315" y="118" font-size="12" text-anchor="middle" fill="#333">切換的繼電器</text><text x="315" y="136" font-size="11" text-anchor="middle" fill="#555">（外面有電吸住，沒電放開）</text>
<line x1="150" y1="82" x2="250" y2="110" stroke="#2e6db0" stroke-width="2.5"/><line x1="150" y1="162" x2="250" y2="134" stroke="#2e7d4f" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="380" y1="122" x2="480" y2="122" stroke="#333" stroke-width="2.5"/><circle cx="510" cy="122" r="22" fill="#f7d74a" stroke="#333" stroke-width="2"/><text x="510" y="127" font-size="11" text-anchor="middle">燈</text>
<rect x="40" y="196" width="560" height="46" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="215" font-size="13" text-anchor="middle" fill="#333">外面有電：繼電器吸住，燈接插座，電池在旁邊慢慢充電</text>
<text x="320" y="234" font-size="13" text-anchor="middle" fill="#c0392b">停電：繼電器的線圈沒電，彈簧把接點彈到電池那邊 → 燈繼續亮</text>
</svg>