<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
<rect width="640" height="300" fill="#fbfaf7"/>
<text x="320" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">同一個插座迴路上的電器：電流會加起來</text>
<rect x="30" y="80" width="110" height="70" rx="8" fill="#e4e7ea" stroke="#6f7a82"/><text x="85" y="108" font-size="13" text-anchor="middle" fill="#333">無熔絲開關</text><text x="85" y="128" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">20A</text>
<line x1="140" y1="100" x2="560" y2="100" stroke="#333" stroke-width="3"/><line x1="140" y1="130" x2="560" y2="130" stroke="#333" stroke-width="3"/>
<line x1="230" y1="100" x2="230" y2="160" stroke="#333" stroke-width="2"/><line x1="260" y1="130" x2="260" y2="160" stroke="#333" stroke-width="2"/>
<rect x="210" y="160" width="70" height="50" rx="6" fill="#cfe0ea" stroke="#6f8fa3"/><text x="245" y="182" font-size="12" text-anchor="middle" fill="#333">電磁爐</text><text x="245" y="200" font-size="11" text-anchor="middle" fill="#555">1200W</text>
<text x="245" y="228" font-size="13" text-anchor="middle" fill="#2e6db0" font-weight="bold">約 11A</text>
<line x1="360" y1="100" x2="360" y2="160" stroke="#333" stroke-width="2"/><line x1="390" y1="130" x2="390" y2="160" stroke="#333" stroke-width="2"/>
<rect x="340" y="160" width="70" height="50" rx="6" fill="#cfe0ea" stroke="#6f8fa3"/><text x="375" y="182" font-size="12" text-anchor="middle" fill="#333">電磁爐</text><text x="375" y="200" font-size="11" text-anchor="middle" fill="#555">1200W</text>
<text x="375" y="228" font-size="13" text-anchor="middle" fill="#2e6db0" font-weight="bold">約 11A</text>
<line x1="490" y1="100" x2="490" y2="160" stroke="#333" stroke-width="2"/><line x1="520" y1="130" x2="520" y2="160" stroke="#333" stroke-width="2"/>
<rect x="470" y="160" width="70" height="50" rx="6" fill="#cfe0ea" stroke="#6f8fa3"/><text x="505" y="182" font-size="12" text-anchor="middle" fill="#333">電磁爐（湯圓）</text><text x="505" y="200" font-size="11" text-anchor="middle" fill="#555">800W</text>
<text x="505" y="228" font-size="13" text-anchor="middle" fill="#2e6db0" font-weight="bold">約 7A</text>
<text x="140" y="90" font-size="12" fill="#2e6db0">流進來的電流＝每一台分走的電流加起來</text>
<rect x="40" y="244" width="560" height="48" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="264" font-size="13" text-anchor="middle" fill="#333">電流＝功率 ÷ 電壓：1200W ÷ 110V ≒ 11A</text>
<text x="320" y="284" font-size="13" text-anchor="middle" fill="#c0392b">11 ＋ 11 ＋ 7 ＝ 29A，超過 20A → 無熔絲開關跳掉，整條迴路斷電</text>
</svg>