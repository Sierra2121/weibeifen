<rect x="40" y="215" width="560" height="28" rx="6" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="234" font-size="12" text-anchor="middle" fill="#333">心臟跳一下 → 血管裡的血變多 → 吸走更多綠光 → 彈回來的光變少。數一分鐘變了幾次，就是心跳</text>
