<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
<rect width="640" height="300" fill="#fbfaf7"/>
<text x="150" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">量電流：電錶「串」進路裡</text>
<line x1="70" y1="60" x2="70" y2="105" stroke="#333" stroke-width="2"/><line x1="70" y1="135" x2="70" y2="180" stroke="#333" stroke-width="2"/>
<line x1="54" y1="108" x2="86" y2="108" stroke="#333" stroke-width="3"/><line x1="62" y1="120" x2="78" y2="120" stroke="#333" stroke-width="3"/><line x1="54" y1="132" x2="86" y2="132" stroke="#333" stroke-width="3"/>
<text x="48" y="114" font-size="12" text-anchor="end" fill="#555">電源</text><text x="48" y="130" font-size="12" text-anchor="end" fill="#555">10V</text>
<rect x="200" y="95" width="20" height="50" fill="#e9d8b4" stroke="#b89d6a"/><text x="194" y="118" font-size="12" text-anchor="end" fill="#555">電阻</text><text x="194" y="134" font-size="12" text-anchor="end" fill="#555">1kΩ</text>
<line x1="210" y1="145" x2="210" y2="180" stroke="#333" stroke-width="2"/><line x1="70" y1="180" x2="210" y2="180" stroke="#333" stroke-width="2"/>
<line x1="70" y1="60" x2="120" y2="60" stroke="#333" stroke-width="2"/><line x1="160" y1="60" x2="210" y2="60" stroke="#333" stroke-width="2"/><line x1="210" y1="60" x2="210" y2="95" stroke="#333" stroke-width="2"/>
<circle cx="140" cy="60" r="20" fill="#fff" stroke="#2e6db0" stroke-width="2.5"/><text x="140" y="65" font-size="15" text-anchor="middle" fill="#2e6db0" font-weight="bold">A</text>
<text x="150" y="212" font-size="12" text-anchor="middle" fill="#2e6db0">要先把路剪開，讓電「經過」電錶</text>
<text x="150" y="230" font-size="12" text-anchor="middle" fill="#2e6db0">像在跑道上設一個計數的關卡</text>
<text x="470" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">量電壓：電錶「並」在兩端</text>
<line x1="390" y1="60" x2="390" y2="105" stroke="#333" stroke-width="2"/><line x1="390" y1="135" x2="390" y2="180" stroke="#333" stroke-width="2"/>
<line x1="374" y1="108" x2="406" y2="108" stroke="#333" stroke-width="3"/><line x1="382" y1="120" x2="398" y2="120" stroke="#333" stroke-width="3"/><line x1="374" y1="132" x2="406" y2="132" stroke="#333" stroke-width="3"/>
<text x="368" y="114" font-size="12" text-anchor="end" fill="#555">電源</text><text x="368" y="130" font-size="12" text-anchor="end" fill="#555">10V</text>
<rect x="520" y="95" width="20" height="50" fill="#e9d8b4" stroke="#b89d6a"/><text x="514" y="118" font-size="12" text-anchor="end" fill="#555">電阻</text><text x="514" y="134" font-size="12" text-anchor="end" fill="#555">1kΩ</text>
<line x1="530" y1="145" x2="530" y2="180" stroke="#333" stroke-width="2"/><line x1="390" y1="180" x2="530" y2="180" stroke="#333" stroke-width="2"/>
<line x1="390" y1="60" x2="530" y2="60" stroke="#333" stroke-width="2"/><line x1="530" y1="60" x2="530" y2="95" stroke="#333" stroke-width="2"/>
<line x1="530" y1="80" x2="580" y2="80" stroke="#c0392b" stroke-width="2"/><line x1="530" y1="162" x2="580" y2="162" stroke="#c0392b" stroke-width="2"/><line x1="580" y1="80" x2="580" y2="101" stroke="#c0392b" stroke-width="2"/><line x1="580" y1="141" x2="580" y2="162" stroke="#c0392b" stroke-width="2"/>
<circle cx="580" cy="121" r="20" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="580" y="126" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">V</text>
<text x="470" y="212" font-size="12" text-anchor="middle" fill="#c0392b">不用剪開，兩支棒子碰在電阻兩邊</text>
<text x="470" y="230" font-size="12" text-anchor="middle" fill="#c0392b">量的是兩端的「高低差」</text>
<rect x="120" y="248" width="400" height="44" rx="8" fill="#eef3f6" stroke="#9fb6c4"/>
<text x="320" y="268" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">歐姆定律：電壓 ＝ 電流 × 電阻（V ＝ I × R）</text>
<text x="320" y="286" font-size="13" text-anchor="middle" fill="#333">10V ＝ 電流 × 1000Ω → 電流 ＝ 0.01A ＝ 10mA</text>
</svg>